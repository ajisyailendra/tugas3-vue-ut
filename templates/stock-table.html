<template id="tpl-stock">
  <div>
    <div class="intro-row"><div><p class="section-label">INVENTARIS • TERBARU</p><p class="muted">Pantau ketersediaan bahan ajar di seluruh UPBJJ.</p></div><button class="btn primary" @click="add">＋ Tambah bahan ajar</button></div>
    <div class="metrics"><div><span>Total judul</span><strong>{{ summary.total }}</strong></div><div><span>Stok aman</span><strong class="green">{{ summary.safe }}</strong></div><div><span>Perlu perhatian</span><strong class="orange">{{ summary.low }}</strong></div></div>
    <div class="filter-box"><div class="filter-title">Saring daftar</div><label>UT-Daerah<select v-model="filters.upbjj"><option value="">Semua UPBJJ</option><option v-for="area in upbjjList" :key="area">{{ area }}</option></select></label><label>Kategori<select v-model="filters.kategori" :disabled="!filters.upbjj"><option value="">Semua kategori</option><option v-for="cat in categoryOptions" :key="cat">{{ cat }}</option></select></label><label>Urutkan<select v-model="filters.sort"><option value="judul">Nama mata kuliah</option><option value="qty">Jumlah stok</option><option value="harga">Harga</option></select></label><label class="check"><input type="checkbox" v-model="filters.low"> Hanya stok menipis</label><button class="text-btn" @click="reset">Reset filter</button></div>
    <div class="table-card"><table><thead><tr><th>Mata kuliah</th><th>Lokasi</th><th>Harga</th><th>Stok</th><th>Status</th><th></th></tr></thead><tbody><tr v-for="item in filteredItems" :key="item.kode"><td><strong>{{ item.judul }}</strong><small>{{ item.kode }} · {{ item.kategori }}</small></td><td><strong>{{ item.upbjj }}</strong><small>Rak {{ item.lokasiRak }}</small></td><td>{{ rupiah(item.harga) }}</td><td><strong>{{ item.qty }} <small>buah</small></strong><small>Safety {{ item.safety }} buah</small></td><td class="status-cell" @mouseenter="note=item.catatanHTML" @mouseleave="note=''"><status-badge :qty="item.qty" :safety="item.safety"></status-badge></td><td class="actions"><button @click="edit(item)" title="Edit">✎</button><button @click="$emit('remove', item)" title="Hapus">×</button></td></tr><tr v-if="!filteredItems.length"><td colspan="6" class="empty">Tidak ada data yang sesuai dengan filter.</td></tr></tbody></table><div v-if="note" class="hover-note" v-html="note"></div></div>
    <div v-if="showForm" class="drawer"><div class="drawer-head"><div><p class="section-label">FORM STOK</p><h2>{{ editing ? 'Perbarui bahan ajar' : 'Tambah bahan ajar' }}</h2></div><button class="close" @click="showForm=false">×</button></div><p class="form-hint">Tekan Enter untuk menyimpan setelah data lengkap.</p><form @submit.prevent="submit" @keydown="enterSave"><div class="form-grid"><label>Kode mata kuliah*<input v-model.trim="form.kode" :readonly="editing" placeholder="Contoh: EKMA4116"></label><label>Nama mata kuliah*<input v-model.trim="form.judul"></label><label>Kategori*<select v-model="form.kategori"><option disabled value="">Pilih kategori</option><option v-for="x in kategoriList">{{x}}</option></select></label><label>UT-Daerah*<select v-model="form.upbjj"><option disabled value="">Pilih UPBJJ</option><option v-for="x in upbjjList">{{x}}</option></select></label><label>Lokasi rak*<input v-model.trim="form.lokasiRak" placeholder="Contoh: R1-A3"></label><label>Harga (Rp)*<input :value="formatInputHarga(form.harga)" @input="setHarga" inputmode="numeric" placeholder="Contoh: 65.000"></label><label>Jumlah stok*<input v-model.number="form.qty" type="number" min="0"></label><label>Stok safety*<input v-model.number="form.safety" type="number" min="0"></label><label class="wide">Catatan saat status di-hover<textarea v-model.trim="form.catatanHTML" placeholder="Contoh: Edisi terbaru tersedia"></textarea></label></div><p v-if="note" class="validation">{{ note }}</p><div class="form-actions"><button type="button" class="btn ghost" @click="showForm=false">Batal</button><button class="btn primary">Simpan bahan ajar</button></div></form></div>
  </div>
</template>
