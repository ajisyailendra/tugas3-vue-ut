<template id="tpl-tracking"><div><div class="intro-row"><div><p class="section-label">PENGIRIMAN • DO</p><p class="muted">Telusuri status distribusi bahan ajar untuk mahasiswa.</p></div><div class="search"><span>⌕</span><input v-model="query" @keyup="clear" placeholder="Cari nomor DO atau NIM..." aria-label="Cari delivery order"><kbd>Esc</kbd></div></div><div class="tracking-list"><article v-for="order in results" :key="order.nomor" class="order-card"><div class="order-top"><div><span class="do-number">{{order.nomor}}</span><h2>{{order.nama}}</h2><p>{{order.nim}} · {{order.ekspedisi}}</p></div><span class="delivery-status">{{order.status}}</span></div><div class="order-meta"><span><small>PAKET</small><strong>{{order.paket}}</strong></span><span><small>DIKIRIM</small><strong>{{date(order.tanggalKirim)}}</strong></span><span><small>TOTAL</small><strong>{{rupiah(order.total)}}</strong></span></div><div class="journey"><div v-for="(trip,index) in order.perjalanan" :key="index" class="journey-item"><i></i><div><strong>{{trip.keterangan}}</strong><small>{{trip.waktu}}</small></div></div></div><button class="text-btn add-progress" @click="openProgress(order)">＋ Tambah pembaruan perjalanan</button></article><div v-if="!results.length" class="empty-card">Delivery order tidak ditemukan.</div></div><div v-if="progressFor" class="progress-backdrop" @click.self="closeProgress"><div class="progress-modal" role="dialog" aria-modal="true"><button class="close-progress" @click="closeProgress" aria-label="Tutup">×</button><p class="section-label">PEMBARUAN PERJALANAN</p><h2>{{progressFor.nomor}}</h2><input v-model="progressText" @keyup.enter="submitProgress" placeholder="Contoh: Tiba di gudang UPBJJ Jakarta" autofocus><div class="progress-actions"><button class="btn ghost" @click="closeProgress">Batal</button><button class="btn primary" @click="submitProgress">Simpan</button></div></div></div></div></template>
